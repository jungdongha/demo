# Quant Signal Domain — Data Model
# Module: Jurine Quant Signal Engine (Phase 9~11)
# Last Updated: 2026-05-21 (Phase 9.5 구현 반영 — 3개 신규 Feature + QuantFundamentalPort)
# 기존 Core 도메인(signal, portfolio, price, stock)과 완전히 분리된 독립 도메인
# 패키지: com.obigo.demodong.domain.quant (Core 패턴 준수 — usecase/presentation도 domain.quant.* 하위)

entities:

  # ─────────────────────────────────────────
  # 1. QuantSignal — Quant 시그널 최종 결과
  # ─────────────────────────────────────────
  QuantSignal:
    table: quant_signal
    extends: BaseEntity
    description: >
      Quant Scoring Engine이 선정한 TOP3 종목의 최종 시그널 결과.
      LLM 리포트는 해석 목적으로만 첨부되며, 추천 선정은 total_score가 결정한다.
    fields:
      ticker:
        type: VARCHAR(20)
        nullable: false
      stock_name:
        type: VARCHAR(100)
        nullable: false
      market_type:
        type: ENUM
        values: [KOR, USA]
        column: "VARCHAR(10) @Enumerated(STRING)"
        nullable: false
      total_score:
        type: "DECIMAL(5,2)"
        nullable: false
        description: Quant Score 합산 (0.00 ~ 100.00)
      signal_rank:
        type: INT
        nullable: false
        description: 당일 순위 (1~3, TOP3만 저장)
      market_regime:
        type: ENUM
        values: [STRONG_BULL, BULL, SIDEWAYS, BEAR, CRISIS]
        column: "VARCHAR(20) @Enumerated(STRING)"
        nullable: false
      llm_report:
        type: TEXT
        nullable: true
        description: LLM이 생성한 해석 리포트 (선정 이유 설명 목적, 추천 근거 아님)
      disclaimer:
        type: TEXT
        nullable: false
        description: "면책 문구 (필수) — 모든 시그널 응답 마지막에 포함"
      signal_date:
        type: DATE
        nullable: false
        description: 시그널 생성 날짜
    factory_method: "QuantSignal.create(ticker, stockName, marketType, totalScore, rank, regime, signalDate)"
    domain_methods:
      - "updateLlmReport(String report)  # AI 리포트 비동기 업데이트"
    indexes:
      - "[signal_date, signal_rank]  # 당일 TOP3 조회"
      - "[ticker, signal_date]       # 종목별 이력 조회"
    relations:
      - "QuantFeatureSnapshot: OneToOne (cascade: ALL)"
      - "QuantAlphaResult: OneToOne (cascade: PERSIST, nullable)"

  # ─────────────────────────────────────────
  # 2. QuantFeatureSnapshot — Feature 값 스냅샷 (Phase 9.5 구현)
  # ─────────────────────────────────────────
  QuantFeatureSnapshot:
    table: quant_feature_snapshot
    extends: BaseEntity
    description: >
      Quant Score 산출 시점의 Feature 값을 보존한다.
      Phase 9: 4개 Feature MVP. Phase 9.5: 7개 Feature (밸류에이션/목표주가/섹터강도 추가).
      QuantSignal과 OneToOne (Quant 측에서 FK 보유).
    factory_method: "QuantFeatureSnapshot.create(QuantSignal signal, QuantScore score, String rawFeatureJson)"
    relations:
      - "QuantSignal: @OneToOne @JoinColumn(quant_signal_id) — FK를 QuantFeatureSnapshot이 보유"
    fields:
      quant_signal_id:
        type: "BIGINT FK → quant_signal"
        nullable: false
        jpa: "@OneToOne(fetch=LAZY) @JoinColumn(unique=true)"
      volume_ratio_5d:
        type: "DECIMAL(6,2)"
        nullable: true
        description: "현재 거래량 / 5일 평균 거래량 (배수). 1.0 = 평균. [Phase 9 구현됨]"
      price_momentum_5d:
        type: "DECIMAL(6,2)"
        nullable: true
        description: "5일 가격 모멘텀 % = (현재가-5일전가)/5일전가*100. [Phase 9 구현됨]"
      news_freshness_score:
        type: "DECIMAL(5,2)"
        nullable: true
        description: "뉴스 개수 기반 신선도 점수 (0~100). [Phase 9 구현됨]"
      market_regime_bonus:
        type: "DECIMAL(5,2)"
        nullable: true
        description: "시장 국면 보정 계수 (-10 ~ +10). [Phase 9 구현됨]"
      # ── Phase 9.5 신규 Feature (구현됨) ──
      per_value:
        type: "DECIMAL(6,2)"
        nullable: true
        description: "KIS inquire-price 기준 PER. 적자 기업(PER≤0)은 null. [Phase 9.5 구현됨]"
      pbr_value:
        type: "DECIMAL(6,2)"
        nullable: true
        description: "KIS inquire-price 기준 PBR. PBR≤0이면 null. [Phase 9.5 구현됨]"
      valuation_score:
        type: "DECIMAL(5,2)"
        nullable: true
        description: "PER+PBR 합산 저평가 점수 (0~100). null(펀더멘털 없음)→50 중립. [Phase 9.5 구현됨]"
      target_price:
        type: "DECIMAL(12,2)"
        nullable: true
        description: "증권사 평균 목표주가. Phase 9.5: null (Stub). Phase 10에서 Naver금융 스크래핑 예정. [Phase 9.5 Stub]"
      target_price_upside_pct:
        type: "DECIMAL(6,2)"
        nullable: true
        description: "목표주가 대비 현재가 상승 여력 (%). null이면 Stub 상태. [Phase 9.5 Stub]"
      target_price_score:
        type: "DECIMAL(5,2)"
        nullable: true
        description: "상승여력 정규화 점수 (0~100). targetPrice=null→50 중립. [Phase 9.5 구현됨]"
      sector_relative_score:
        type: "DECIMAL(5,2)"
        nullable: true
        description: "섹터 평균 5일 모멘텀 대비 종목 상대 강도 (0~100). [Phase 9.5 구현됨]"
      # ── Phase 10+ 예정 Feature (미구현) ──
      # foreign_buy_velocity:    DECIMAL(6,2) — 외국인 순매수 가속도 (KIS 별도 Endpoint 필요)
      # institution_buy_velocity: DECIMAL(6,2) — 기관 순매수 가속도
      # short_covering_score:    DECIMAL(5,2) — 숏커버링 가능성
      # price_in_risk:           DECIMAL(5,2) — 선반영 리스크 (0~1)
      # volume_acceleration:     DECIMAL(6,2) — 거래량 가속도 (분봉)
      # price_momentum_15m:      DECIMAL(6,2) — 15분 가격 모멘텀
      raw_feature_json:
        type: TEXT
        nullable: true
        description: 전체 Feature 원시값 JSON (FeatureType Enum 키, 디버깅용)
      snapshot_at:
        type: TIMESTAMP
        nullable: false
        description: Feature 수집 시각

  # ─────────────────────────────────────────
  # 3. QuantAlphaResult — Alpha 추적 결과
  # ─────────────────────────────────────────
  QuantAlphaResult:
    table: quant_alpha_result
    extends: BaseEntity
    description: >
      Quant 시그널 이후 T+3, T+10, T+20 실제 주가 변동을 추적한다.
      Phase 8 signal_feedback과 동일한 다중 타임프레임 구조 적용.
      Self-Correction 가중치 조정 및 RAG Positive/Negative 갱신에 활용.
    fields:
      quant_signal_id:
        type: "BIGINT FK → quant_signal"
        nullable: false
      price_at_signal:
        type: "DECIMAL(12,2)"
        description: 시그널 생성 시점 주가
      price_after_3d:
        type: "DECIMAL(12,2)"
        nullable: true
      price_after_10d:
        type: "DECIMAL(12,2)"
        nullable: true
      price_after_20d:
        type: "DECIMAL(12,2)"
        nullable: true
      price_mdd:
        type: "DECIMAL(12,2)"
        nullable: true
        description: 기간 내 최저가 (MDD 계산용)
      alpha_3d:
        type: "DECIMAL(6,2)"
        nullable: true
        description: T+3 Alpha (실제 수익률 - 지수 수익률, %)
      alpha_10d:
        type: "DECIMAL(6,2)"
        nullable: true
        description: T+10 Alpha (%) — Primary 평가 지표
      alpha_20d:
        type: "DECIMAL(6,2)"
        nullable: true
        description: T+20 Alpha (%)
      mdd_pct:
        type: "DECIMAL(6,2)"
        nullable: true
        description: 최대 낙폭 %
      benchmark_return:
        type: "DECIMAL(6,2)"
        nullable: true
        description: "벤치마크 지수 수익률 (KOR: KOSPI / USA: S&P500, %)"
      was_successful:
        type: BOOLEAN
        nullable: true
        description: alpha_10d > 0 이면 true
      is_failure:
        type: BOOLEAN
        nullable: true
        description: "alpha_10d < -5% → Negative Sampling 대상 (Phase 8 패턴 동일)"
      rag_updated:
        type: "BOOLEAN DEFAULT false"
        description: RAG Positive/Negative 케이스 업데이트 완료 여부
      evaluated_at:
        type: TIMESTAMP
        nullable: true
        description: T+10 이후 배치에서 설정
    domain_methods:
      - "evaluate(BigDecimal price10d, BigDecimal benchmarkReturn)  # alpha_10d 계산 + was_successful/is_failure 결정"
      - "markRagUpdated()  # RAG 갱신 완료 처리"

  # ─────────────────────────────────────────
  # 4. QuantUniverse — 분석 대상 유니버스
  # ─────────────────────────────────────────
  QuantUniverse:
    table: quant_universe
    extends: BaseEntity
    description: >
      Quant Signal Engine이 분석하는 고정 유니버스 (KOR TOP10 + USA TOP10 = 20개).
      분기별 리밸런싱. active=true인 종목만 분석 대상.
    fields:
      ticker:
        type: VARCHAR(20)
        nullable: false
      stock_name:
        type: VARCHAR(100)
        nullable: false
      market_type:
        type: ENUM
        values: [KOR, USA]
        column: "VARCHAR(10) @Enumerated(STRING)"
      market_cap_rank:
        type: INT
        description: 시총 순위 (1~10)
      sector:
        type: VARCHAR(50)
        description: 섹터명 (반도체, 금융, 소비재 등)
      active:
        type: "BOOLEAN DEFAULT true"
        description: 현재 분석 대상 여부 (리밸런싱 시 변경)
      added_at:
        type: DATE
      removed_at:
        type: DATE
        nullable: true
        description: 유니버스 제외일

# ─────────────────────────────────────────
# 도메인 모델 (Value Objects / Records)
# ─────────────────────────────────────────
domain_models:

  QuantFundamentalData:
    status: "✅ Phase 9.5 신규"
    type: record
    package: com.obigo.demodong.domain.quant.domain.model
    description: >
      종목의 재무 펀더멘털 데이터 (KIS inquire-price + 목표주가).
      PER/PBR은 적자기업 대응을 위해 nullable. targetPrice는 Phase 9.5 Stub.
    fields:
      per:
        type: "BigDecimal (nullable)"
        description: "PER. 적자기업(PER≤0) 또는 데이터 없음 → null"
      pbr:
        type: "BigDecimal (nullable)"
        description: "PBR. PBR≤0 또는 데이터 없음 → null"
      targetPrice:
        type: "BigDecimal (nullable)"
        description: "증권사 평균 목표주가. Phase 9.5: 항상 null (Stub). Phase 10에서 실제 연동"
      currentPrice:
        type: "BigDecimal"
        description: "KIS 조회 기준 현재가 (stck_prpr)"
    factory_method: "QuantFundamentalData.stub(BigDecimal currentPrice) — per/pbr/targetPrice=null"

  QuantFeatureInput:
    status: "✅ Phase 9.5 수정 (Phase 9 대비 2개 필드 추가)"
    type: record
    package: com.obigo.demodong.domain.quant.domain.model
    fields:
      ticker: String
      stockName: String
      market: MarketType
      priceHistory: "List<DailyQuote>"
      recentNews: "List<String>"
      indexReturn5d: double
      fundamentals: "QuantFundamentalData (nullable) ← Phase 9.5 신규"
      sectorAvgMomentum5d: "double (0.0 = 섹터 없음) ← Phase 9.5 신규"

  QuantScore:
    status: "✅ Phase 9.5 수정 (Phase 9 대비 4개 필드 추가)"
    type: record
    package: com.obigo.demodong.domain.quant.domain.model
    added_in_9_5:
      - "double valuationScore"
      - "double targetPriceUpsideScore"
      - "double sectorRelativeScore"
      - "QuantFundamentalData fundamentals (nullable)"

# ─────────────────────────────────────────
# 도메인 서비스 (Phase 9.5 구현 기준)
# ─────────────────────────────────────────
domain_services:

  MarketRegimeService:
    status: "✅ Phase 9 구현됨"
    package: com.obigo.demodong.domain.quant.domain.service
    description: 지수 5일 변동률 기반 시장 국면 판단 (VIX는 Phase 10+)
    methods:
      - "analyze(double indexReturn5d): MarketRegime"
    logic: |
      > +3%  → STRONG_BULL
      > 0%   → BULL
      > -2%  → SIDEWAYS
      > -5%  → BEAR
      <= -5% → CRISIS

  QuantScoringService:
    status: "✅ Phase 9.5 구현됨"
    package: com.obigo.demodong.domain.quant.domain.service
    description: Feature 가중치 합산으로 0~100점 Quant Score 산출 + TOP3 선별
    methods:
      - "score(QuantFeatureInput input): QuantScore"
      - "selectTop3(List<QuantScore> filtered): List<QuantScore>"
    weights_phase9_mvp:
      VOLUME_RATIO_5D: 35%
      PRICE_MOMENTUM_5D: 30%
      NEWS_FRESHNESS: 20%
      MARKET_REGIME: "직접 보정 (-10 ~ +10)"
      note: "총합 0.85 (Phase 9 MVP)"
    weights_phase9_5:
      VOLUME_RATIO_5D: 20%
      PRICE_MOMENTUM_5D: 20%
      NEWS_FRESHNESS: 10%
      VALUATION_SCORE: 20%
      TARGET_PRICE_UPSIDE: 15%
      SECTOR_RELATIVE_STRENGTH: 15%
      MARKET_REGIME: "직접 보정 (-10 ~ +10)"
      note: "총합 1.00 (Phase 9.5 — 현행)"

  RiskFilterService:
    status: "✅ Phase 9 구현됨"
    package: com.obigo.demodong.domain.quant.domain.service
    description: Score 무관하게 아래 조건 해당 시 후보에서 제외
    filters:
      - "유동성: volumeRatio5d < 0.3 → EXCLUDE"
      - "선반영: priceMomentum5d > 20.0 → EXCLUDE"
      - "하락장: BEAR + priceMomentum5d < -5.0 → EXCLUDE"

  QuantSignalReader:
    status: "✅ Phase 9 구현됨"
    package: com.obigo.demodong.domain.quant.domain.service

  QuantSignalWriter:
    status: "✅ Phase 9 구현됨"
    package: com.obigo.demodong.domain.quant.domain.service

  QuantUniverseReader:
    status: "✅ Phase 9 구현됨"
    package: com.obigo.demodong.domain.quant.domain.service

  QuantAlphaEvaluationService:
    status: "⏳ Phase 11 예정"
    description: T+10 주가를 수집하여 Alpha를 계산하고 Self-Correction을 트리거한다

# ─────────────────────────────────────────
# Feature Calculator (Strategy Pattern)
# ─────────────────────────────────────────
feature_calculators:
  interface: QuantFeatureCalculator
  package: com.obigo.demodong.domain.quant.domain.calculator
  method: "calculate(QuantFeatureInput input): QuantFeatureResult"

  implementations:
    VolumeRatio5dCalculator:
      status: "✅ Phase 9 구현됨"
      feature: VOLUME_RATIO_5D
      formula: "min(currentVolume / avg5dVolume / 3.0, 1.0) * 100"
      weight: 20%  # Phase 9.5에서 35% → 20% 조정

    PriceMomentum5dCalculator:
      status: "✅ Phase 9 구현됨"
      feature: PRICE_MOMENTUM_5D
      formula: "(currentPrice - price5dAgo) / price5dAgo * 100 → 정규화: ±10% → 0~100"
      weight: 20%  # Phase 9.5에서 30% → 20% 조정

    NewsFreshnessCalculator:
      status: "✅ Phase 9 구현됨"
      feature: NEWS_FRESHNESS
      formula: "min(newsCount * 10, 100)"
      weight: 10%  # Phase 9.5에서 20% → 10% 조정

    MarketRegimeScoreCalculator:
      status: "✅ Phase 9 구현됨"
      feature: MARKET_REGIME
      formula: "STRONG_BULL+10 / BULL+5 / SIDEWAYS+0 / BEAR-5 / CRISIS-10"
      weight: "직접 totalScore에 가산"

    # ── Phase 9.5 신규 Calculator ──

    ValuationScoreCalculator:
      status: "✅ Phase 9.5 구현됨"
      feature: VALUATION_SCORE
      weight: 20%
      formula: |
        perScore:
          per=null → 50 (중립, 적자기업)
          0 < per ≤ 10 → 100
          10 < per ≤ 30 → 선형 보간 (100→0)
          per > 30 → 0
        pbrScore:
          pbr=null → 50 (중립)
          0 < pbr ≤ 1 → 100
          1 < pbr ≤ 3 → 선형 보간 (100→0)
          pbr > 3 → 0
        normalizedScore = (perScore + pbrScore) / 2
        fundamentals=null → 50 (중립)
      rawValue: "PER 값 (per)"

    TargetPriceUpsideCalculator:
      status: "✅ Phase 9.5 구현됨 (Stub 모드)"
      feature: TARGET_PRICE_UPSIDE
      weight: 15%
      formula: |
        upside% = (targetPrice - currentPrice) / currentPrice * 100
        normalizedScore = clamp(upside% / 30.0 * 100, 0, 100)
        targetPrice=null → 50 (중립, Phase 9.5 Stub)
        upside% < 0 → 0 (목표주가 하향)
        upside% >= 30% → 100 (만점)
      rawValue: "상승여력 % (upside%)"
      note: "Phase 10에서 Naver금융/증권사 API로 실제 목표주가 수집 예정"

    SectorRelativeStrengthCalculator:
      status: "✅ Phase 9.5 구현됨"
      feature: SECTOR_RELATIVE_STRENGTH
      weight: 15%
      formula: |
        selfMomentum5d = (priceHistory[0] - priceHistory[min(size-1,4)]) / priceHistory[min(size-1,4)] * 100
        relative = selfMomentum5d - input.sectorAvgMomentum5d()
        normalizedScore = clamp((relative + 10) / 20.0 * 100, 0, 100)
        prices.size() < 2 → 50 (중립)
        note: sectorAvgMomentum5d는 QuantEngineUseCase Pass1에서 사전 집계하여 QuantFeatureInput에 주입
      rawValue: "섹터 대비 상대 모멘텀 %p (relative)"

# ─────────────────────────────────────────
# 외부 인터페이스 (Port — DIP 준수)
# ─────────────────────────────────────────
ports:
  QuantDataPort:
    status: "✅ Phase 9 구현됨"
    description: KOR 일별 시세 + KOSPI 지수 조회 인터페이스 (Core의 StockPricePort와 독립)
    package: com.obigo.demodong.domain.quant.domain.port
    methods:
      - "fetchRecentPrices(String ticker, MarketType market, int days): List<DailyQuote>"
      - "fetchIndexReturn5d(MarketType market): double"
    implementations:
      KisQuantDataAdapter:
        status: "✅ Phase 9 구현됨"
        package: com.obigo.demodong.domain.quant.infrastructure
        note: KOR 전용 (KIS API). USA는 빈 목록/0.0 Stub 반환. KisTokenManager 재활용.
      AlphaVantageQuantAdapter:
        status: "⏳ Phase 10 예정 (MVP: Stub)"
        package: com.obigo.demodong.domain.quant.infrastructure (미구현)
        note: USA 실제 연동. Phase 10에서 Alpha Vantage API 연동.

  QuantNewsPort:
    status: "✅ Phase 9 구현됨"
    description: 기존 NewsCrawlerStrategy를 Quant 도메인용으로 감싸는 어댑터 인터페이스
    package: com.obigo.demodong.domain.quant.domain.port
    methods:
      - "fetchNews(String query, MarketType market): List<String>"
    implementations:
      QuantNewsCrawlerAdapter:
        status: "✅ Phase 9 구현됨"
        package: com.obigo.demodong.domain.quant.infrastructure
        note: "Module Guard 준수: Quant → NewsCrawlerStrategy 직접 의존 대신 Adapter 사용"

  QuantFundamentalPort:
    status: "✅ Phase 9.5 구현됨"
    description: KOR 실시간 PER/PBR/현재가 + 목표주가 수집 인터페이스 (DIP 준수)
    package: com.obigo.demodong.domain.quant.domain.port
    methods:
      - "fetchFundamentals(String ticker, MarketType market): QuantFundamentalData"
    implementations:
      KisFundamentalAdapter:
        status: "✅ Phase 9.5 구현됨"
        package: com.obigo.demodong.domain.quant.infrastructure
        endpoint: "/uapi/domestic-stock/v1/quotations/inquire-price (tr_id: FHKST01010100/VHKST01010100)"
        fields_used: "stck_prpr(현재가), per, pbr"
        note: |
          KOR: KIS inquire-price — per/pbr ≤0 → null 처리 (적자기업 대응)
          USA: QuantFundamentalData.stub(BigDecimal.ZERO) (Phase 10에서 Alpha Vantage 연동)
          실패 시: stub 반환 (예외 미전파)

  QuantRagPort:
    status: "⏳ Phase 10 예정"
    description: Phase 7 PGVector 인프라를 Quant용으로 활용하는 인터페이스 (Phase 7 미구현으로 대기)

# ─────────────────────────────────────────
# 패키지 구조 (Phase 9 실제 구현 기준)
# ─────────────────────────────────────────
package_structure:
  note: >
    원래 설계(quant_signal.yaml)는 usecase/presentation을 최상위 분리로 기술했으나,
    Phase 9 구현 시 기존 Core 코드베이스 일관성 우선으로 domain.quant.* 패턴 통일.
  actual_layout: |
    com.obigo.demodong.domain.quant/
      domain/
        entity/     — QuantUniverse, QuantSignal, QuantFeatureSnapshot
        repository/ — QuantUniverseRepository, QuantSignalRepository, QuantFeatureSnapshotRepository
        service/    — MarketRegimeService, QuantScoringService, RiskFilterService
                      QuantUniverseReader, QuantSignalReader, QuantSignalWriter
        port/       — QuantDataPort, QuantNewsPort, QuantFundamentalPort
        calculator/ — QuantFeatureCalculator(i/f), VolumeRatio5dCalculator,
                      PriceMomentum5dCalculator, NewsFreshnessCalculator,
                      MarketRegimeScoreCalculator,
                      ValuationScoreCalculator,          ← Phase 9.5 신규
                      TargetPriceUpsideCalculator,       ← Phase 9.5 신규
                      SectorRelativeStrengthCalculator   ← Phase 9.5 신규
        model/      — DailyQuote, QuantFeatureInput, QuantFeatureResult, QuantScore,
                      QuantFundamentalData                ← Phase 9.5 신규
        enums/      — MarketRegime, FeatureType
      application/
        usecase/    — QuantEngineUseCase (배치), QuantSignalUseCase (조회)
        dto/response/ — QuantSignalResponse, QuantScoreResponse, QuantScoreDetailResponse,
                        QuantUniverseResponse, MarketRegimeResponse, QuantFeatureSnapshotResponse
        scheduler/  — QuantSignalScheduler
        exception/  — QuantErrorCode
      presentation/ — QuantController, QuantResponseCode
      infrastructure/ — KisQuantDataAdapter, QuantNewsCrawlerAdapter, QuantUniverseInitializer,
                        KisFundamentalAdapter  ← Phase 9.5 신규

# ─────────────────────────────────────────
# API 에러코드
# ─────────────────────────────────────────
error_codes:
  domain: quant
  range: 405xx
  codes:
    40501: QUANT_SIGNAL_NOT_FOUND
    40502: QUANT_UNIVERSE_EMPTY
    40503: MARKET_REGIME_CRISIS      # CRISIS 국면에서 시그널 요청 불가
    40504: QUANT_DATA_FETCH_FAILED   # KIS/Alpha Vantage 수집 실패
    40505: QUANT_SCORE_CALC_FAILED   # Scoring Engine 오류

# ─────────────────────────────────────────
# Cross-Module 규칙
# ─────────────────────────────────────────
cross_module_rules:
  - "Core 도메인(domain/signal, domain/portfolio 등)과 Quant 도메인(domain/quant)은 서로 직접 의존하지 않는다."
  - "공유 인프라(PGVector RAG, Telegram Bot)는 source_module 메타데이터로 구분하여 공용 사용."
  - "KisTokenManager는 Quant에서도 재활용 가능 (Spring Bean 공유)."
  - "QuantDataPort는 StockPricePort와 독립 인터페이스로 유지. 혼용 금지."
