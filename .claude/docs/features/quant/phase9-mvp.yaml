# Feature Specification — Phase 9 MVP
# Status: Draft
# Last Updated: 2026-05-15

meta:
  id: FEAT-009
  title: "Quant Signal Engine MVP — Feature Engineering + Scoring Engine"
  type: Feature
  phase: Phase 9
  author: Agent
  status: Draft

# ─────────────────────────────────────────
# Overview
# ─────────────────────────────────────────
overview:
  summary: >
    KOR/USA 시총 TOP20 대상 정량 Quant Score를 산출하여 상위 3개 종목을 선별하고,
    AI(Groq)가 선별 이유를 해석하는 최소 동작 파이프라인 구축.
    "숫자가 판단하고 LLM이 설명한다" 원칙.

  user_story: >
    As a 주린이 투자자,
    I want to 매일 아침 시총 상위 종목 중 퀀트 지표 기반 TOP3 종목과 AI 해석 리포트를 확인하고,
    so that 정량 데이터 기반의 객관적 투자 참고 정보를 얻는다.

  goals:
    - QuantUniverse (KOR 10 + USA 10, 고정 유니버스) 관리
    - Feature Engineering Layer — 4개 MVP Feature 계산
    - Quant Scoring Engine — 가중치 합산 0~100점
    - Risk Filtering Layer — 3개 필터 적용
    - TOP3 선별 + Groq LLM 해석 리포트 생성
    - 일배치 스케줄러 (KOR 09:10 / USA 22:30)
    - /api/quant/** 5개 API 엔드포인트

# ─────────────────────────────────────────
# Scope
# ─────────────────────────────────────────
scope:
  in:
    entities:
      - QuantUniverse       # 분석 대상 유니버스 (KOR 10 + USA 10)
      - QuantSignal         # TOP3 시그널 결과
      - QuantFeatureSnapshot # Feature 값 스냅샷
    domain_services:
      - QuantScoringService  # Feature → Score 계산 + TOP3 선별
      - MarketRegimeService  # 시장 국면 판단 (KIS 지수 기반)
      - RiskFilterService    # 3개 리스크 필터
      - QuantSignalReader    # 시그널 조회
      - QuantSignalWriter    # 시그널 저장
      - QuantUniverseReader  # 유니버스 조회
    ports:
      - QuantDataPort        # 외부 데이터 수집 인터페이스 (DIP)
    adapters:
      - KisQuantDataAdapter         # KOR 데이터 (KIS API + KisTokenManager 재활용)
      - AlphaVantageQuantAdapter    # USA 데이터 (Stub — Phase 10에서 실제 연동)
    feature_calculators:           # Strategy Pattern (QuantFeatureCalculator interface)
      - VolumeRatio5dCalculator     # 거래량 배수 (PriceSnapshot DB 재활용)
      - PriceMomentum5dCalculator   # 5일 가격 모멘텀 %
      - NewsFreshnessCalculator     # 뉴스 신선도 점수 (기존 Crawler 재활용)
      - MarketRegimeScoreCalculator # 시장 국면 보정 계수
    usecases:
      - QuantSignalUseCase  # 조회 operations (top-signals, scores, universe, regime)
      - QuantEngineUseCase  # 점수 계산 + 시그널 생성 (배치에서 호출)
    scheduler:
      - QuantSignalScheduler  # 09:10 KOR / 22:30 USA
    controller:
      - QuantController  # /api/quant/**
    error_codes:
      - QuantErrorCode   # 405xx

  out: >
    RAG 통합 (Phase 7 미구현 → Phase 10+),
    QuantAlphaResult / Alpha Tracking (Phase 11),
    가중치 Self-Correction (Phase 11),
    외국인/기관 순매수 속도 Feature (KIS 별도 Endpoint → Phase 10),
    Short Covering Score (금융위 Open API → Phase 10),
    Alpha Vantage 실제 연동 (Phase 10),
    실시간 장중 분봉 Feature (volume_acceleration, price_momentum_15m → Phase 10)

# ─────────────────────────────────────────
# Package Structure
# (Core 패턴 준수 — domain.quant.* 통합)
# ─────────────────────────────────────────
package_structure:
  note: >
    quant_signal.yaml은 usecase/presentation을 최상위 분리로 기술하나,
    기존 Core 코드베이스 일관성을 위해 domain.quant.* 패턴으로 통일한다.
  layout: |
    domain/quant/
      domain/
        entity/
          QuantUniverse.java
          QuantSignal.java
          QuantFeatureSnapshot.java
        repository/
          QuantUniverseRepository.java
          QuantSignalRepository.java
          QuantFeatureSnapshotRepository.java
        service/
          QuantSignalReader.java
          QuantSignalWriter.java
          QuantUniverseReader.java
          QuantScoringService.java       # Feature → Score + TOP3 선별
          MarketRegimeService.java       # 시장 국면 판단
          RiskFilterService.java         # 리스크 필터
        port/
          QuantDataPort.java             # 외부 데이터 인터페이스 (DIP)
        calculator/
          QuantFeatureCalculator.java    # 인터페이스 (Strategy)
          QuantFeatureResult.java        # 계산 결과 record
          VolumeRatio5dCalculator.java
          PriceMomentum5dCalculator.java
          NewsFreshnessCalculator.java
          MarketRegimeScoreCalculator.java
      application/
        usecase/
          QuantSignalUseCase.java        # 조회 Facade
          QuantEngineUseCase.java        # 시그널 생성 (배치 호출)
        dto/
          response/
            QuantSignalResponse.java
            QuantScoreDetailResponse.java
            QuantUniverseResponse.java
            MarketRegimeResponse.java
        scheduler/
          QuantSignalScheduler.java
        exception/
          QuantErrorCode.java
      presentation/
        QuantController.java
        QuantResponseCode.java
      infrastructure/
        KisQuantDataAdapter.java    # KOR (KisTokenManager 재활용)
        AlphaVantageQuantAdapter.java  # USA Stub

# ─────────────────────────────────────────
# Feature Engineering (MVP 4개)
# ─────────────────────────────────────────
feature_engineering:
  interface: QuantFeatureCalculator
  method: "QuantFeatureResult calculate(String ticker, MarketType market)"
  enum: FeatureType  # VOLUME_RATIO_5D | PRICE_MOMENTUM_5D | NEWS_FRESHNESS | MARKET_REGIME

  features:
    volume_ratio_5d:
      description: 현재 거래량 / 5일 평균 거래량 (배수)
      data_source: PriceSnapshot 테이블 (이미 DB에 있음, KIS API 재활용)
      calculator: VolumeRatio5dCalculator
      logic: |
        List<PriceSnapshot> recent5d = priceSnapshotRepository.findTop5ByTickerOrderByPriceDateDesc(ticker);
        double avg5dVolume = recent5d.stream().mapToLong(PriceSnapshot::getVolume).average();
        double currentVolume = recent5d.get(0).getVolume();
        return currentVolume / avg5dVolume;  // 1.0 = 평균, >1 = 거래 증가
      normalized: "0.0 ~ 5.0+ (5.0 이상은 cap)"

    price_momentum_5d:
      description: 5일 가격 모멘텀 (%)
      data_source: PriceSnapshot 테이블
      calculator: PriceMomentum5dCalculator
      logic: |
        BigDecimal currentPrice = recent5d.get(0).getClosePrice();
        BigDecimal price5dAgo  = recent5d.get(recent5d.size()-1).getClosePrice();
        return (currentPrice - price5dAgo) / price5dAgo * 100;
      normalized: "% 값 그대로 (-100 ~ +100)"

    news_freshness_score:
      description: 최근 24시간 뉴스 개수 기반 신선도 점수 (0~100)
      data_source: 기존 NewsPort (NaverFinanceCrawler / YahooFinanceCrawler) 재활용
      calculator: NewsFreshnessCalculator
      logic: |
        List<String> news = newsCrawlerStrategy.crawl(ticker, market);
        int count = news.size();
        return Math.min(count * 10, 100);  // 뉴스 10개 이상 = 100점
      normalized: "0 ~ 100"

    market_regime:
      description: 시장 국면 보정 계수 (-10 ~ +10)
      data_source: KisQuantDataAdapter (KOR: KOSPI 지수 0001 / USA: 고정 BULL 임시)
      calculator: MarketRegimeScoreCalculator
      logic: |
        MarketRegime regime = marketRegimeService.analyze(market);
        return switch(regime) {
          case STRONG_BULL -> +10;
          case BULL        -> +5;
          case SIDEWAYS    -> 0;
          case BEAR        -> -5;
          case CRISIS      -> -10;
        };
      normalized: "-10 ~ +10 (보정 계수)"

# ─────────────────────────────────────────
# Quant Scoring Engine
# ─────────────────────────────────────────
scoring:
  class: QuantScoringService
  formula: >
    totalScore = (volume_ratio_score * 35)
               + (momentum_score * 30)
               + (news_freshness_score * 20)
               + market_regime_bonus  [+10 to -10]
    → cap 0~100

  feature_normalization:
    volume_ratio_5d: "normalizedScore = min(volumeRatio / 3.0, 1.0) * 100"
    price_momentum_5d: "normalizedScore = min(max(momentum + 10, 0), 20) / 20 * 100  (±10% 범위 정규화)"
    news_freshness_score: "그대로 사용 (0~100)"

  weights:
    volume_ratio_5d: 0.35
    price_momentum_5d: 0.30
    news_freshness_score: 0.20
    market_regime_bonus: 보정 (-10 ~ +10 직접 가산)

  result: QuantScore record (ticker, totalScore, featureScores Map, marketRegime, calculatedAt)

# ─────────────────────────────────────────
# Risk Filtering
# ─────────────────────────────────────────
risk_filtering:
  class: RiskFilterService
  filters:
    - name: 유동성 필터
      condition: volume_ratio_5d < 0.3
      action: EXCLUDE
      reason: 거래량 급감 — 유동성 부족

    - name: 하락장 필터
      condition: regime == BEAR AND price_momentum_5d < -5.0
      action: EXCLUDE
      reason: 하락장 + 약세 종목 제외

    - name: 급등 선반영 필터
      condition: price_momentum_5d > 20.0
      action: EXCLUDE
      reason: 이미 20% 이상 급등 — 선반영 리스크

  after_filter: TOP3 선별 (totalScore 내림차순 정렬 후 상위 3개)
  crisis_handling: >
    MarketRegime == CRISIS → 전체 유니버스 시그널 생성 중단,
    QuantErrorCode.MARKET_REGIME_CRISIS 예외 발생 (QuantController에서 응답)

# ─────────────────────────────────────────
# Market Regime Analysis (간단 버전)
# ─────────────────────────────────────────
market_regime:
  class: MarketRegimeService
  data: KIS 지수 5일 일별 데이터 (KOR: 코스피 지수 코드 "0001")
  logic: |
    KOR: KisQuantDataAdapter.fetchIndexReturn5d("0001") 로 5일 지수 변동률 계산
    USA: Phase 10에서 Alpha Vantage 연동. MVP에서는 BULL 고정 (Stub)

    KOR 판단 기준 (5일 지수 변동률):
      > +3%  → STRONG_BULL
      > 0%   → BULL
      > -2%  → SIDEWAYS
      > -5%  → BEAR
      <= -5% → CRISIS
  note: >
    KIS 지수 API: GET /uapi/domestic-stock/v1/quotations/inquire-daily-indexchartprice
    trId: FHKUP03500100 (업무 일련번호)

# ─────────────────────────────────────────
# QuantDataPort & Adapters
# ─────────────────────────────────────────
ports:
  QuantDataPort:
    package: domain.quant.domain.port
    methods:
      - "fetchVolumeAndPrice(String ticker, MarketType market, int days): List<DailyQuote>"
      - "fetchIndexReturn5d(String indexCode): double  // KOR 지수 5일 변동률"
    note: >
      MVP에서는 기존 PriceSnapshot 테이블 데이터를 우선 활용.
      QuantDataPort는 신규 실시간 데이터가 필요한 경우를 위한 확장점.

  KisQuantDataAdapter:
    package: domain.quant.infrastructure
    implements: QuantDataPort
    reuse: KisTokenManager (Spring Bean 재활용)
    note: >
      KOR 전용. fetchIndexReturn5d()만 신규 구현.
      fetchVolumeAndPrice()는 기존 PriceSnapshot 테이블로 대체 (KIS 추가 호출 최소화).

  AlphaVantageQuantAdapter:
    package: domain.quant.infrastructure
    status: Stub (USA — Phase 10에서 실제 연동)
    note: >
      MVP: USA 종목의 fetchVolumeAndPrice()는 PriceSnapshot 테이블 fallback.
      fetchIndexReturn5d()는 BULL 고정 반환.

