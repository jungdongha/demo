# ─────────────────────────────────────────
# LLM Report Generation
# ─────────────────────────────────────────
llm_report:
  engine: Groq (llama-3.1-8b-instant) — 기존 AiChatService 재활용 또는 직접 ChatClient
  trigger: TOP3 선별 후 각 종목별 1회 호출
  prompt_template: |
    너는 퀀트 애널리스트다. 아래 정량 지표 기반으로 {ticker}({name}) 종목이
    오늘 TOP3에 선정된 이유를 3줄로 설명하라.

    [Quant Score] {totalScore}점
    [거래량 배수] {volumeRatio5d}배 (5일 평균 대비)
    [5일 모멘텀] {priceMomentum5d}%
    [뉴스 신선도] {newsFreshnessScore}점
    [시장 국면] {marketRegime}

    출력 형식:
    ① {수급/모멘텀/뉴스 중 핵심 근거 1}
    ② {핵심 근거 2}
    ③ {핵심 근거 3}
    ⚠️ 본 시그널은 AI 참고 정보입니다. 투자 판단과 책임은 전적으로 사용자에게 있습니다.
  timeout: 30s, 실패 시 llm_report = null (API는 정상 응답)

# ─────────────────────────────────────────
# Batch Scheduler
# ─────────────────────────────────────────
scheduler:
  class: QuantSignalScheduler
  jobs:
    kor_batch:
      cron: "0 10 9 * * MON-FRI"     # 09:10 (장 개시 10분 후)
      action: QuantEngineUseCase.runBatch(MarketType.KOR)

    usa_batch:
      cron: "0 30 22 * * MON-FRI"    # 22:30 (미국장 개시 후)
      action: QuantEngineUseCase.runBatch(MarketType.USA)

# ─────────────────────────────────────────
# API Endpoints
# ─────────────────────────────────────────
technical_spec:
  api:
    - method: GET
      path: /api/quant/top-signals
      summary: 오늘의 TOP3 Quant 시그널 조회 (DB 캐시)
      auth: 없음
      request: 없음
      response:
        dto: "List<QuantSignalResponse>"
        wrapper: "ApiResponse<List<QuantSignalResponse>>"
        fields:
          - signalId, ticker, stockName, marketType
          - totalScore, signalRank, marketRegime
          - llmReport, disclaimer, signalDate
          - featureSnapshot (QuantFeatureSnapshotResponse 내포)

    - method: GET
      path: /api/quant/scores
      summary: 전체 유니버스 최신 Quant Score 목록
      auth: 없음
      response:
        dto: "List<QuantScoreResponse>"
        fields: [ticker, stockName, marketType, totalScore, signalDate, signalRank(nullable)]

    - method: GET
      path: /api/quant/scores/{ticker}
      summary: 특정 종목 Quant Score 상세 (Feature 값 포함)
      auth: 없음
      path_param: ticker (종목코드)
      response:
        dto: QuantScoreDetailResponse
        fields:
          - ticker, stockName, marketType, totalScore, marketRegime
          - featureSnapshot (volume_ratio_5d, price_momentum_5d, news_freshness_score 등)
          - signalDate
      error:
        - 40501: QUANT_SIGNAL_NOT_FOUND (해당 ticker 시그널 없음)

    - method: GET
      path: /api/quant/universe
      summary: 현재 분석 유니버스 목록 (active=true)
      auth: 없음
      response:
        dto: "List<QuantUniverseResponse>"
        fields: [ticker, stockName, marketType, marketCapRank, sector, addedAt]

    - method: GET
      path: /api/quant/regime
      summary: 현재 시장 국면 조회 (KOR/USA)
      auth: 없음
      response:
        dto: MarketRegimeResponse
        fields: [korRegime, usaRegime, analyzedAt]

  data_flow:
    GET /api/quant/top-signals:
      - step: 1
        layer: Presentation
        action: "QuantController.getTopSignals() → QuantSignalUseCase.getTopSignals()"
      - step: 2
        layer: UseCase
        action: "QuantSignalReader.findTodayTop3() → 오늘 날짜 signal_date 기준 DB 조회"
      - step: 3
        layer: Domain
        action: "QuantSignal + QuantFeatureSnapshot JOIN 조회"
      - step: 4
        layer: Response
        action: "QuantSignalResponse.from(signal) 변환 반환"

    POST /internal/quant/run-batch (Scheduler only):
      - step: 1
        layer: Scheduler
        action: "QuantSignalScheduler → QuantEngineUseCase.runBatch(marketType)"
      - step: 2
        layer: UseCase
        action: |
          1. QuantUniverseReader.findActiveByMarket(market)  // 유니버스 10개
          2. MarketRegimeService.analyze(market)              // 시장 국면 판단
          3. If CRISIS → throw QuantErrorCode.MARKET_REGIME_CRISIS (스케줄러 로그 후 중단)
          4. For each ticker: run QuantFeatureCalculators (4개)
          5. QuantScoringService.score() → List<QuantScore>
          6. RiskFilterService.filter() → 필터 적용
          7. QuantScoringService.selectTop3()
          8. For each TOP3: Groq LLM 리포트 생성
          9. QuantSignalWriter.saveAll() (QuantSignal + QuantFeatureSnapshot)
      - step: 3
        layer: Infrastructure
        action: "KisQuantDataAdapter (KOR 지수) / AlphaVantageQuantAdapter Stub (USA)"

  database:
    entities:
      - name: QuantUniverse
        action: Read (초기 데이터는 @PostConstruct로 insert)
        table: quant_universe
      - name: QuantSignal
        action: Create (배치 시 신규 생성)
        table: quant_signal
        note: signal_date 기준 당일 데이터 존재하면 덮어쓰기 (upsert 또는 delete+insert)
      - name: QuantFeatureSnapshot
        action: Create (QuantSignal과 함께 생성, cascade ALL)
        table: quant_feature_snapshot

  validation_rules:
    - "QuantUniverse: ticker + market_type UNIQUE 제약"
    - "QuantSignal: signal_date + ticker UNIQUE (당일 중복 시그널 방지)"
    - "CRISIS 국면에서는 시그널 생성 중단 (배치 스킵)"
    - "TOP3 미만 종목 (필터 후 3개 미만): 가능한 수만큼 저장 (최소 0개)"
    - "LLM 실패 시: llm_report = null, disclaimer는 항상 저장"

# ─────────────────────────────────────────
# Error Codes (405xx)
# ─────────────────────────────────────────
error_codes:
  40501: QUANT_SIGNAL_NOT_FOUND      # 해당 ticker/날짜 시그널 없음
  40502: QUANT_UNIVERSE_EMPTY        # 유니버스에 active 종목 없음
  40503: MARKET_REGIME_CRISIS        # CRISIS 국면 — 시그널 요청 불가
  40504: QUANT_DATA_FETCH_FAILED     # KIS/Alpha Vantage 수집 실패
  40505: QUANT_SCORE_CALC_FAILED     # Scoring 계산 오류

# ─────────────────────────────────────────
# Testing Strategy
# ─────────────────────────────────────────
testing_strategy:
  scope: UseCase + Domain Service 단위 테스트 (JUnit 5 + Mockito)

  happy_path:
    - "KOR 유니버스 10개 전체 정상 처리 시 TOP3 시그널이 저장된다"
    - "volume_ratio_5d 가장 높은 종목이 score 상위에 포함된다"
    - "MarketRegime BULL이면 market_regime_bonus +5점이 적용된다"

  edge_cases:
    - "유동성 필터 통과 종목이 3개 미만이면 가능한 수만큼 저장된다"
    - "CRISIS 국면에서 runBatch() 호출 시 MARKET_REGIME_CRISIS 예외 발생"
    - "LLM 호출 실패 시 llm_report=null로 QuantSignal이 저장된다"
    - "같은 날 두 번 배치 실행 시 기존 시그널이 교체(delete+insert)된다"

  error_cases:
    - "KIS API 호출 실패 시 QUANT_DATA_FETCH_FAILED 예외 처리"
    - "유니버스가 비어있으면 QUANT_UNIVERSE_EMPTY 예외"
    - "/api/quant/scores/{ticker}에서 존재하지 않는 ticker 요청 시 40501 응답"

# ─────────────────────────────────────────
# Implementation Order (Bottom-Up)
# ─────────────────────────────────────────
implementation_order:
  1: "QuantUniverse, QuantSignal, QuantFeatureSnapshot 엔티티"
  2: "Repository 인터페이스 3개"
  3: "QuantFeatureCalculator 인터페이스 + 4개 Calculator 구현체"
  4: "MarketRegimeService, QuantScoringService, RiskFilterService"
  5: "QuantDataPort 인터페이스 + KisQuantDataAdapter (지수 조회만) + AlphaVantageQuantAdapter Stub"
  6: "QuantUniverseReader, QuantSignalReader, QuantSignalWriter"
  7: "QuantEngineUseCase (핵심 배치 로직)"
  8: "QuantSignalUseCase (조회 Facade)"
  9: "QuantErrorCode + QuantResponseCode"
  10: "QuantController (/api/quant/**)"
  11: "QuantSignalScheduler (배치 트리거)"
  12: "QuantUniverseInitializer (@PostConstruct 초기 데이터)"
  13: "application.yml: alpha-vantage 설정 추가"
  14: "단위 테스트 작성"

# ─────────────────────────────────────────
# application.yml 추가 설정
# ─────────────────────────────────────────
config:
  alpha_vantage:
    api-key: ${ALPHA_VANTAGE_API_KEY:stub}
    base-url: https://www.alphavantage.co/query
  note: "Phase 10에서 실제 API 키 설정. MVP에서는 Stub 동작."
