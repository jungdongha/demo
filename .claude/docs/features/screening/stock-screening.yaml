# Feature Specification — 종목 스크리닝 API
# Status: Draft
# Last Updated: 2026-06-05

meta:
  id: FEAT-010
  title: "종목 스크리닝 API — 전략별 조건 필터링"
  type: Feature
  phase: Phase 7 (추가)
  author: Agent
  status: Draft

# ─────────────────────────────────────────
# Overview
# ─────────────────────────────────────────
overview:
  summary: >
    7개 전략 점수 중 사용자가 지정한 최소 점수 조건을 만족하는 종목을
    필터링하여 반환하는 스크리닝 API. 이미 분석된 캐시 데이터를 재활용해
    추가 KIS/DART 호출 없이 빠르게 응답한다.

  user_story: >
    As a 퀀트 투자자,
    I want to CAN SLIM 점수 70점 이상, Piotroski 60점 이상인 종목만 골라내고 싶고,
    so that 다수 종목 중 내 전략에 맞는 후보군만 빠르게 파악한다.

  goals:
    - 복수의 전략 점수 조건(AND)을 쿼리 파라미터로 받아 필터링
    - 기존 분석 결과(캐시 또는 DB) 재활용 — KIS/DART 추가 호출 없음
    - 결과를 종합 점수(합산) 내림차순으로 정렬

# ─────────────────────────────────────────
# Scope
# ─────────────────────────────────────────
scope:
  in:
    domain: analysis
    new_entities: []       # 신규 엔티티 없음 — 기존 분석 결과 재활용
    new_domain_services:
      - ScreeningService   # 필터 조건 적용 + 결과 정렬
    new_usecases:
      - ScreeningUseCase   # Facade: 조건 수신 → ScreeningService 위임
    new_controllers:
      - ScreeningController  # GET /api/screening
    reuse:
      - AnalysisUseCase          # 개별 종목 분석 (캐시 경유)
      - MagicFormulaRankRepository # Magic Formula 랭크 조회
      - StockReader              # 종목 목록 조회

  out: >
    실시간 데이터 재수집 (이미 캐시된 결과만 사용),
    백테스트 통합 (Phase 3.5),
    사용자별 스크리닝 조건 저장/불러오기 (Phase 9+)

# ─────────────────────────────────────────
# Package Structure
# ─────────────────────────────────────────
package_structure:
  layout: |
    domain/analysis/
      domain/
        service/
          ScreeningService.java       # NEW — 필터 로직
      application/
        usecase/
          ScreeningUseCase.java       # NEW — Facade
        dto/
          request/
            ScreeningRequest.java     # NEW — record (전략별 minScore Map)
          response/
            ScreeningResult.java      # NEW — record (ticker + scores Map)
      presentation/
        ScreeningController.java      # NEW — GET /api/screening

# ─────────────────────────────────────────
# API Endpoints
# ─────────────────────────────────────────
technical_spec:
  api:
    - method: GET
      path: /api/screening
      summary: 전략 점수 조건 기반 종목 스크리닝
      auth: 없음
      request:
        type: QueryParam
        params:
          - name: canslim
            type: Integer
            required: false
            description: "CAN SLIM 최소 점수 (0~100)"
          - name: momentum
            type: Integer
            required: false
            description: "듀얼 모멘텀 최소 점수"
          - name: minervini
            type: Integer
            required: false
            description: "미네르비니 최소 점수"
          - name: piotroski
            type: Integer
            required: false
            description: "Piotroski F-Score 최소 점수"
          - name: magic
            type: Integer
            required: false
            description: "Magic Formula 최소 점수"
          - name: reversion
            type: Integer
            required: false
            description: "Mean Reversion 최소 점수"
          - name: seasonality
            type: Integer
            required: false
            description: "시즌성 최소 점수"
          - name: tickers
            type: "String (comma-separated)"
            required: false
            description: "스크리닝 대상 종목 목록 (생략 시 등록된 관심종목 대상)"
      response:
        dto: "List<ScreeningResult>"
        wrapper: "ApiResponse<List<ScreeningResult>>"
        fields:
          - ticker
          - companyName
          - scores (Map<StrategyType, Integer>)
          - totalScore (합산)
          - passedStrategies (List<String>)

  data_flow:
    - step: 1
      layer: Presentation
      action: "ScreeningController → 쿼리 파라미터 → ScreeningRequest record 생성"
    - step: 2
      layer: UseCase
      action: >
        ScreeningUseCase:
        1. tickers 미지정 시 WatchlistRepository.findAll() 로 대상 종목 로드
        2. AnalysisUseCase.analyze(ticker) — @Cacheable("analysis") 경유 (캐시 hit 기대)
        3. ScreeningService.filter(results, request) 호출
    - step: 3
      layer: Domain
      action: >
        ScreeningService:
        각 전략 점수가 request의 조건 이상인 종목만 통과 (AND 조건)
        통과 종목을 totalScore 내림차순 정렬
    - step: 4
      layer: Response
      action: "ScreeningResult 리스트 반환 (빈 결과도 200 OK)"

  database:
    entities:
      - name: PortfolioDetail (Watchlist)
        action: Read
        fields: "ticker (관심종목 목록, tickers 미지정 시)"
    note: >
      스크리닝 결과는 저장하지 않음. 실시간 조회 + 캐시 활용.

  validation_rules:
    - "점수 파라미터 범위: 0~100 (범위 벗어나면 400)"
    - "조건이 하나도 없을 경우 400 반환 (최소 1개 전략 조건 필요)"
    - "tickers 파라미터 각 코드: ^[A-Za-z0-9.\\-]{1,20}$ 패턴 검증"

# ─────────────────────────────────────────
# Testing Strategy
# ─────────────────────────────────────────
testing_strategy:
  happy_path:
    - "canslim=70 조건 → CAN SLIM 70점 이상 종목만 반환된다"
    - "canslim=50&piotroski=60 → 두 조건 모두 만족하는 종목만 반환된다"
    - "결과는 totalScore 내림차순으로 정렬된다"
  edge_cases:
    - "조건을 만족하는 종목이 없으면 빈 리스트 + 200 OK 반환"
    - "tickers 지정 시 해당 종목만 스크리닝 대상"
    - "캐시 미스 시 실시간 분석 후 캐시 저장"
  error_cases:
    - "조건 파라미터 없이 호출 → 400 INVALID_ARGUMENT"
    - "점수 파라미터에 101 입력 → 400 INVALID_ARGUMENT"

# ─────────────────────────────────────────
# Implementation Order
# ─────────────────────────────────────────
implementation_order:
  1: "ScreeningRequest record (전략별 minScore Map)"
  2: "ScreeningResult record (ticker + scores + totalScore)"
  3: "ScreeningService (필터 + 정렬 순수 도메인 로직)"
  4: "ScreeningUseCase (Facade: watchlist 로드 + 분석 + 필터)"
  5: "ScreeningController (GET /api/screening, @Validated + 파라미터 검증)"
  6: "단위 테스트: ScreeningService (Mock AnalysisResult 사용)"
