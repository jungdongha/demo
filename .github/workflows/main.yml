name: demo-dong CI/CD

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Java 21로 변경
          distribution: 'temurin'

      # 1. 빌드 (테스트는 일단 제외해서 속도 높이기)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
        env: # 여기에 환경 변수 추가
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # 빌드 시에도 필요할 수 있으므로 추가
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 2. 도커 허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 이미지 빌드 & 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo-dong:latest # 이미지 이름 변경

      # 4. AWS EC2 접속 및 배포
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            docker stop demo-dong || true # 컨테이너 이름 변경
            docker rm demo-dong || true # 컨테이너 이름 변경
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/demo-dong:latest # 이미지 이름 변경
            docker run -d --name demo-dong \
              -p 8090:8090 \
              -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              -e NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }} \
              -e NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }} \
              -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              -e TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/demo-dong:latest # 컨테이너 이름, 포트, GROQ_API_KEY 추가
