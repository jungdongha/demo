name: demo-dong CI/CD

on:
  push:
    branches: [ "dev", "feat" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feat')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo-dong:latest

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PROPERTIES: ${{ secrets.ENV_PROPERTIES }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: ENV_PROPERTIES
          script: |
            echo "$ENV_PROPERTIES" > ~/demo-dong.env
            docker stop demo-dong || true
            docker rm demo-dong || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/demo-dong:latest
            docker run -d --name demo-dong \
              -p 8090:8090 \
              --env-file ~/demo-dong.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/demo-dong:latest
