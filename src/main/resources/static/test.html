<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주식 분석 테스트</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h3 { border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        input[type=text] { width: 300px; padding: 8px; font-size: 15px; }
        button { padding: 8px 14px; margin-left: 6px; cursor: pointer; }
        .box {
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 14px;
            border-radius: 8px;
            min-height: 80px;
            margin-top: 10px;
            line-height: 1.6;
        }
        .status { color: gray; margin-top: 6px; font-size: 13px; }
        #signal { font-size: 22px; font-weight: bold; margin: 12px 0; }
        section { margin-bottom: 40px; }
    </style>
</head>
<body>

<!-- ① Groq 연결 테스트 -->
<section>
    <h3>① Groq 연결 테스트</h3>
    <input type="text" id="aiQuestion" value="안녕? 한 문장으로 답해줘." />
    <button onclick="testGroq()">전송</button>
    <div class="status" id="aiStatus">대기 중</div>
    <div class="box" id="aiOutput"></div>
</section>

<!-- ② SSE 주식 분석 -->
<section>
    <h3>② SSE 주식 분석</h3>
    <p>한국: <code>삼성전자</code> &nbsp;|&nbsp; 미국: <code>AAPL</code></p>
    <input type="text" id="query" value="삼성전자" />
    <button onclick="startSse()">SSE 분석</button>
    <button onclick="stopSse()" style="background:#eee;">중단</button>
    <div id="signal"></div>
    <div class="status" id="sseStatus">대기 중</div>
    <div class="box" id="sseOutput"></div>
</section>

<script>
    // ① Groq 연결 테스트
    async function testGroq() {
        const question = document.getElementById('aiQuestion').value.trim();
        if (!question) return;
        document.getElementById('aiStatus').textContent = '요청 중...';
        document.getElementById('aiOutput').textContent = '';
        try {
            const res = await fetch(`/api/ai/chat?question=${encodeURIComponent(question)}`);
            const json = await res.json();
            document.getElementById('aiOutput').textContent = JSON.stringify(json, null, 2);
            document.getElementById('aiStatus').textContent = res.ok ? '✅ 연결 성공' : '❌ 오류';
        } catch (e) {
            document.getElementById('aiOutput').textContent = e.message;
            document.getElementById('aiStatus').textContent = '❌ 연결 실패';
        }
    }

    // ② SSE 주식 분석
    let eventSource = null;

    function startSse() {
        const query = document.getElementById('query').value.trim();
        if (!query) return;
        stopSse();
        document.getElementById('sseOutput').textContent = '';
        document.getElementById('signal').textContent = '';
        document.getElementById('sseStatus').textContent = '연결 중...';

        eventSource = new EventSource(`/api/stock/analyze/${encodeURIComponent(query)}/stream`);

        eventSource.addEventListener('message', e => {
            document.getElementById('sseStatus').textContent = '수신 중...';
            document.getElementById('sseOutput').textContent += e.data;
        });

        eventSource.addEventListener('done', e => {
            const signal = e.data;
            const emoji = signal === 'BUY' ? '🟢' : signal === 'SELL' ? '🔴' : '🟡';
            document.getElementById('signal').textContent = `${emoji} ${signal}`;
            document.getElementById('sseStatus').textContent = '분석 완료 — DB 저장됨';
            stopSse();
        });

        eventSource.addEventListener('error', e => {
            document.getElementById('sseStatus').textContent = '오류: ' + (e.data || '연결 실패');
            stopSse();
        });
    }

    function stopSse() {
        if (eventSource) { eventSource.close(); eventSource = null; }
    }
</script>
</body>
</html>
