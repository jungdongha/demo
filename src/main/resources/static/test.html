<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주식 분석 테스트</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h3 { border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-top: 40px; }
        input[type=text], input[type=number] { padding: 7px; font-size: 14px; margin: 3px; }
        button { padding: 7px 14px; margin: 3px; cursor: pointer; }
        .btn-del { background: #fee; color: #c00; border: 1px solid #c00; }
        .box {
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 14px;
            border-radius: 8px;
            min-height: 60px;
            margin-top: 10px;
            line-height: 1.6;
            font-size: 13px;
        }
        .status { color: gray; margin-top: 6px; font-size: 12px; }
        #signal { font-size: 22px; font-weight: bold; margin: 10px 0; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 7px 10px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

<!-- ① Groq 연결 테스트 -->
<section>
    <h3>① Groq 연결 테스트</h3>
    <input type="text" id="aiQuestion" value="안녕? 한 문장으로 답해줘." style="width:320px" />
    <button onclick="testGroq()">전송</button>
    <div class="status" id="aiStatus">대기 중</div>
    <div class="box" id="aiOutput"></div>
</section>

<!-- ② SSE 주식 분석 -->
<section>
    <h3>② SSE 주식 분석</h3>
    <p style="font-size:13px; color:#555">한국: <code>삼성전자</code> | 미국: <code>AAPL</code></p>
    <input type="text" id="query" value="삼성전자" style="width:200px" />
    <button onclick="startSse()">SSE 분석</button>
    <button onclick="stopSse()" style="background:#eee;">중단</button>
    <div id="signal"></div>
    <div class="status" id="sseStatus">대기 중</div>
    <div class="box" id="sseOutput" style="min-height:200px"></div>
</section>

<!-- ③ 보유 종목 관리 -->
<section>
    <h3>③ 보유 종목 관리</h3>
    <div>
        <input type="text" id="pTicker" placeholder="삼성전자 or AAPL" style="width:160px" />
        <input type="number" id="pQty" placeholder="수량" style="width:80px" />
        <input type="number" id="pAvg" placeholder="평균매수가" step="0.01" style="width:120px" />
        <button onclick="addPortfolio()">등록</button>
        <button onclick="loadPortfolio()" style="background:#eee;">새로고침</button>
    </div>
    <div class="status" id="pStatus">대기 중</div>
    <table id="pTable">
        <thead><tr><th>ID</th><th>티커</th><th>마켓</th><th>수량</th><th>평균매수가</th><th>삭제</th></tr></thead>
        <tbody id="pBody"></tbody>
    </table>
</section>

<!-- ④ 관심 종목 관리 -->
<section>
    <h3>④ 관심 종목 관리</h3>
    <div>
        <input type="text" id="wTicker" placeholder="삼성전자 or AAPL" style="width:200px" />
        <button onclick="addWatchlist()">등록</button>
        <button onclick="loadWatchlist()" style="background:#eee;">새로고침</button>
    </div>
    <div class="status" id="wStatus">대기 중</div>
    <table id="wTable">
        <thead><tr><th>ID</th><th>티커</th><th>이름</th><th>마켓</th><th>삭제</th></tr></thead>
        <tbody id="wBody"></tbody>
    </table>
</section>

<script>
    // ① Groq 연결 테스트
    async function testGroq() {
        const q = document.getElementById('aiQuestion').value.trim();
        if (!q) return;
        document.getElementById('aiStatus').textContent = '요청 중...';
        document.getElementById('aiOutput').textContent = '';
        try {
            const res = await fetch(`/api/ai/chat?question=${encodeURIComponent(q)}`);
            const json = await res.json();
            document.getElementById('aiOutput').textContent = JSON.stringify(json, null, 2);
            document.getElementById('aiStatus').textContent = res.ok ? '✅ 연결 성공' : '❌ 오류';
        } catch (e) {
            document.getElementById('aiOutput').textContent = e.message;
            document.getElementById('aiStatus').textContent = '❌ 연결 실패';
        }
    }

    // ② SSE 주식 분석
    let eventSource = null;
    function startSse() {
        const query = document.getElementById('query').value.trim();
        if (!query) return;
        stopSse();
        document.getElementById('sseOutput').textContent = '';
        document.getElementById('signal').textContent = '';
        document.getElementById('sseStatus').textContent = '연결 중...';
        eventSource = new EventSource(`/api/stock/analyze/${encodeURIComponent(query)}/stream`);
        eventSource.addEventListener('message', e => {
            document.getElementById('sseStatus').textContent = '수신 중...';
            document.getElementById('sseOutput').textContent += e.data;
        });
        eventSource.addEventListener('done', e => {
            const signal = e.data;
            const emoji = signal === 'BUY' ? '🟢' : signal === 'SELL' ? '🔴' : '🟡';
            document.getElementById('signal').textContent = `${emoji} ${signal}`;
            document.getElementById('sseStatus').textContent = '분석 완료 — DB 저장됨';
            stopSse();
        });
        eventSource.addEventListener('error', e => {
            document.getElementById('sseStatus').textContent = '오류: ' + (e.data || '연결 실패');
            stopSse();
        });
    }
    function stopSse() {
        if (eventSource) { eventSource.close(); eventSource = null; }
    }

    // ③ 보유 종목
    async function addPortfolio() {
        const ticker = document.getElementById('pTicker').value.trim();
        const quantity = parseInt(document.getElementById('pQty').value);
        const avgPrice = parseFloat(document.getElementById('pAvg').value);
        if (!ticker || !quantity || !avgPrice) return;
        document.getElementById('pStatus').textContent = '등록 중...';
        const res = await fetch('/api/portfolio', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticker, quantity, avgPrice })
        });
        document.getElementById('pStatus').textContent = res.ok ? '✅ 등록 완료' : '❌ 오류';
        loadPortfolio();
    }

    async function loadPortfolio() {
        const res = await fetch('/api/portfolio');
        const json = await res.json();
        const rows = (json.data || []).map(p =>
            `<tr>
                <td>${p.id}</td><td>${p.ticker}</td><td>${p.marketType}</td>
                <td>${p.quantity}</td><td>${p.avgPrice}</td>
                <td><button class="btn-del" onclick="deletePortfolio(${p.id})">삭제</button></td>
            </tr>`
        ).join('');
        document.getElementById('pBody').innerHTML = rows || '<tr><td colspan="6">없음</td></tr>';
    }

    async function deletePortfolio(id) {
        await fetch(`/api/portfolio/${id}`, { method: 'DELETE' });
        loadPortfolio();
    }

    // ④ 관심 종목
    async function addWatchlist() {
        const ticker = document.getElementById('wTicker').value.trim();
        if (!ticker) return;
        document.getElementById('wStatus').textContent = '등록 중...';
        const res = await fetch('/api/watchlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticker })
        });
        document.getElementById('wStatus').textContent = res.ok ? '✅ 등록 완료' : '❌ 오류';
        loadWatchlist();
    }

    async function loadWatchlist() {
        const res = await fetch('/api/watchlist');
        const json = await res.json();
        const rows = (json.data || []).map(w =>
            `<tr>
                <td>${w.id}</td><td>${w.ticker}</td><td>${w.name}</td><td>${w.marketType}</td>
                <td><button class="btn-del" onclick="deleteWatchlist(${w.id})">삭제</button></td>
            </tr>`
        ).join('');
        document.getElementById('wBody').innerHTML = rows || '<tr><td colspan="5">없음</td></tr>';
    }

    async function deleteWatchlist(id) {
        await fetch(`/api/watchlist/${id}`, { method: 'DELETE' });
        loadWatchlist();
    }

    // 페이지 로드 시 목록 초기화
    loadPortfolio();
    loadWatchlist();
</script>
</body>
</html>
