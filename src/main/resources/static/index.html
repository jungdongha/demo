<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jurine — AI 주식 시그널</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════════
       DESIGN TOKENS
    ══════════════════════════════════════════════ */
    :root {
      --bg:        #07080A;
      --bg2:       #0C0E12;
      --surface:   #111318;
      --surface2:  #181B22;
      --surface3:  #1E2129;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.12);

      --text:      #E8ECF4;
      --text-soft: #A0A8B8;
      --text-muted:#5A6478;

      --buy:       #00E676;
      --buy-dim:   rgba(0, 230, 118, 0.12);
      --buy-glow:  rgba(0, 230, 118, 0.35);

      --sell:      #FF3D57;
      --sell-dim:  rgba(255, 61, 87, 0.12);
      --sell-glow: rgba(255, 61, 87, 0.35);

      --hold:      #FFAB00;
      --hold-dim:  rgba(255, 171, 0, 0.12);
      --hold-glow: rgba(255, 171, 0, 0.35);

      --cyan:      #00C8FF;
      --cyan-dim:  rgba(0, 200, 255, 0.10);
      --cyan-glow: rgba(0, 200, 255, 0.30);

      --font-display: 'Orbitron', sans-serif;
      --font-ui:      'Noto Sans KR', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;

      --sidebar-w: 210px;
      --radius:    10px;
      --radius-lg: 14px;
    }

    /* ══════════════════════════════════════════════
       RESET & BASE
    ══════════════════════════════════════════════ */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
    }

    /* Dot-grid background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo-area {
      padding: 24px 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan-glow);
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    .nav {
      flex: 1;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.18s ease;
      user-select: none;
    }

    .nav-item:hover {
      background: var(--surface2);
      color: var(--text-soft);
    }

    .nav-item.active {
      background: var(--cyan-dim);
      color: var(--cyan);
      box-shadow: inset 2px 0 0 var(--cyan);
    }

    .nav-icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ══════════════════════════════════════════════
       MAIN LAYOUT
    ══════════════════════════════════════════════ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .topbar {
      padding: 0 28px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 13, 18, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .breadcrumb {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .topbar-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .pulse-dot.live {
      background: var(--buy);
      box-shadow: 0 0 8px var(--buy-glow);
      animation: pulseAnim 1.4s infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity:1; }
      50% { opacity:0.4; }
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

    /* ══════════════════════════════════════════════
       TAB PAGES
    ══════════════════════════════════════════════ */
    .tab-page { display: none; }
    .tab-page.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════════════
       SECTION HEADER
    ══════════════════════════════════════════════ */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ══════════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-cyan {
      background: var(--cyan);
      color: #000;
    }
    .btn-cyan:hover { background: #33D4FF; box-shadow: 0 0 16px var(--cyan-glow); }

    .btn-ghost {
      background: transparent;
      color: var(--text-soft);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    .btn-danger {
      background: var(--sell-dim);
      color: var(--sell);
      border: 1px solid rgba(255,61,87,0.2);
    }
    .btn-danger:hover { background: rgba(255,61,87,0.2); }

    .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; }

    /* ══════════════════════════════════════════════
       STOCK CARDS GRID
    ══════════════════════════════════════════════ */
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
    }

    .stock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .stock-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .stock-card:hover {
      border-color: rgba(0,200,255,0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,200,255,0.1);
    }

    .stock-card:hover::before { opacity: 1; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .ticker-label {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .ticker-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 400;
    }

    .market-pill {
      font-size: 9px;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      background: var(--surface2);
    }

    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .price-block {}

    .price-label-sm {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 2px;
    }

    .price-value {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .sub-price {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 3px;
    }

    .profit-display {
      text-align: right;
    }

    .profit-rate-value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
    }

    .profit-pos { color: var(--buy); text-shadow: 0 0 12px var(--buy-glow); }
    .profit-neg { color: var(--sell); text-shadow: 0 0 12px var(--sell-glow); }
    .profit-nil { color: var(--text-muted); }

    .qty-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 2px;
    }

    .card-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    /* ══════════════════════════════════════════════
       SIGNAL BADGES
    ══════════════════════════════════════════════ */
    .signal-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }

    .sig-buy  { background: var(--buy-dim);  color: var(--buy);  border: 1px solid rgba(0,230,118,0.25); box-shadow: 0 0 10px var(--buy-glow); }
    .sig-sell { background: var(--sell-dim); color: var(--sell); border: 1px solid rgba(255,61,87,0.25);  box-shadow: 0 0 10px var(--sell-glow); }
    .sig-hold { background: var(--hold-dim); color: var(--hold); border: 1px solid rgba(255,171,0,0.25);  box-shadow: 0 0 10px var(--hold-glow); }

    /* ══════════════════════════════════════════════
       ANALYSIS TAB
    ══════════════════════════════════════════════ */
    .analysis-wrap {
      max-width: 820px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      font-family: var(--font-ui);
      color: var(--text);
      transition: all 0.18s;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }

    .signal-result-bar {
      display: none;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: var(--radius);
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .signal-result-bar.visible { display: flex; }

    .signal-hero {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 8px;
    }

    .hero-buy  { background: var(--buy-dim);  color: var(--buy);  box-shadow: 0 0 20px var(--buy-glow); }
    .hero-sell { background: var(--sell-dim); color: var(--sell); box-shadow: 0 0 20px var(--sell-glow); }
    .hero-hold { background: var(--hold-dim); color: var(--hold); box-shadow: 0 0 20px var(--hold-glow); }

    .analysis-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .analysis-output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      min-height: 220px;
      line-height: 1.75;
      position: relative;
    }

    /* Markdown styles within output */
    .analysis-output h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 14px;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
    }

    .analysis-output h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 18px 0 8px;
      color: var(--text-soft);
    }

    .analysis-output strong { color: var(--cyan); font-weight: 600; }
    .analysis-output em { color: var(--text-soft); }

    .analysis-output ul {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .analysis-output li {
      color: var(--text-soft);
      font-size: 13.5px;
    }

    .analysis-output p { margin: 8px 0; color: var(--text-soft); font-size: 13.5px; }

    .analysis-output hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    .analysis-output code {
      font-family: var(--font-mono);
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--cyan);
    }

    /* Streaming cursor */
    .stream-cursor::after {
      content: '▊';
      color: var(--cyan);
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .placeholder-text { color: var(--text-muted); font-size: 13px; }

    /* ══════════════════════════════════════════════
       REPORTS TABLE
    ══════════════════════════════════════════════ */
    .report-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
    }

    .report-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .report-table tbody td {
      padding: 13px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .report-table tbody tr:last-child td { border-bottom: none; }

    .report-table tbody tr {
      transition: background 0.12s;
    }

    .report-table tbody tr:hover td { background: var(--surface2); }

    .ticker-cell {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .reason-cell {
      color: var(--text-muted);
      font-size: 12px;
      max-width: 380px;
      line-height: 1.5;
    }

    .time-cell {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .source-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border2);
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ══════════════════════════════════════════════
       MODALS (ADD STOCK)
    ══════════════════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      width: min(420px, 92vw);
      animation: modalIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 22px;
      color: var(--text);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      font-family: var(--font-ui);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input::placeholder { color: var(--text-muted); }

    .field input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    /* ══════════════════════════════════════════════
       CHART MODAL
    ══════════════════════════════════════════════ */
    .chart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chart-overlay.open { display: flex; }

    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      width: min(1060px, 96vw);
      animation: modalIn 0.22s ease;
    }

    .chart-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 16px;
    }

    .chart-ticker-display {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
    }

    .chart-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .chart-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .close-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .close-btn:hover { color: var(--text); background: var(--surface3); }

    #tv_chart_container {
      width: 100%;
      height: 480px;
      border-radius: 8px;
      overflow: hidden;
    }

    /* ══════════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════════ */
    .toast-stack {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: toastIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ══════════════════════════════════════════════
       EMPTY STATE
    ══════════════════════════════════════════════ */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 14px;
      line-height: 1.6;
    }

    /* ══════════════════════════════════════════════
       STAT ROW (portfolio summary)
    ══════════════════════════════════════════════ */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .stat-label {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
  </style>
</head>

     SCRIPTS

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/* ─────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────── */
let activeTab       = 'portfolio';
let sse             = null;
let chartTicker     = null;
let chartMarket     = null;

/* ─────────────────────────────────────────────────
   TAB SWITCHING
───────────────────────────────────────────────── */
const TAB_TITLES = {
  portfolio: '포트폴리오',
  watchlist:  '관심 종목',
  analysis:   '시그널 분석',
  reports:    '오늘의 리포트',
};

const TAB_LOADERS = {
  portfolio: loadPortfolio,
  watchlist:  loadWatchlist,
  reports:    loadReports,
};

function switchTab(tab) {
  if (activeTab === tab) return;
  activeTab = tab;

  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.getElementById(`tab-${tab}`).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('pageTitle').textContent = TAB_TITLES[tab];

  if (TAB_LOADERS[tab]) TAB_LOADERS[tab]();
}

/* ─────────────────────────────────────────────────
   PORTFOLIO
───────────────────────────────────────────────── */
async function loadPortfolio() {
  try {
    const res  = await fetch('/api/portfolio');
    const json = await res.json();
    const data = json.data || [];

    renderStatRow(data);
    renderPortfolioGrid(data);
  } catch {
    toast('❌ 포트폴리오 로드 실패');
  }
}

function renderStatRow(data) {
  const row = document.getElementById('statRow');
  if (!data.length) { row.style.display = 'none'; return; }

  const total   = data.length;
  const profits = data.filter(d => d.profitRate != null);
  const avgRate = profits.length
    ? (profits.reduce((s, d) => s + Number(d.profitRate), 0) / profits.length).toFixed(2)
    : null;
  const buys  = data.filter(d => d.signalType === 'BUY').length;

  const avgClass = avgRate == null ? 'profit-nil' : avgRate >= 0 ? 'profit-pos' : 'profit-neg';
  const avgText  = avgRate == null ? '—' : (avgRate >= 0 ? '+' : '') + avgRate + '%';

  row.style.display = 'grid';
  row.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">보유 종목</div>
      <div class="stat-value">${total}<span style="font-size:13px;color:var(--text-muted)"> 개</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 수익률</div>
      <div class="stat-value ${avgClass}">${avgText}</div>
    </div>
  `;
}

function renderPortfolioGrid(data) {
  const grid = document.getElementById('portfolioGrid');

  if (!data.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">💼</div>
      <div class="empty-text">보유 종목이 없습니다<br>+ 종목 추가를 눌러 시작하세요</div>
    </div>`;
    return;
  }

  grid.innerHTML = data.map(p => {
    const rate      = p.profitRate;
    const rateClass = rate == null ? 'profit-nil' : rate >= 0 ? 'profit-pos' : 'profit-neg';
    const rateText  = rate == null ? '—' : (rate >= 0 ? '+' : '') + rate + '%';
    const sign      = rate == null ? '' : rate >= 0 ? '▲ ' : '▼ ';

    const encodedData = encodeURIComponent(JSON.stringify(p));

    return `<div class="stock-card" onclick="openChart('${esc(p.ticker)}','${p.marketType}','${esc(p.name)}', '${encodedData}')">
      <div class="card-header">
        <div>
          <div class="ticker-label">${esc(p.ticker)}</div>
          <div class="ticker-name">${esc(p.name)}</div>
        </div>
        <span class="market-pill">${p.marketType}</span>
      </div>

      <div class="card-body">
        <div class="price-block">
          <div class="price-label-sm">평균매수가</div>
          <div class="price-value">${fmt(p.avgPrice)}</div>
          ${p.currentPrice ? `<div class="sub-price">현재 ${fmt(p.currentPrice)}</div>` : ''}
        </div>
        <div class="profit-display">
          <div class="price-label-sm">수익률</div>
          <div class="profit-rate-value ${rateClass}">${sign}${rateText}</div>
          <div class="qty-label">${p.quantity}주</div>
        </div>
      </div>

      <div class="card-footer">
        <button class="btn btn-danger btn-sm" style="flex:1"
          onclick="event.stopPropagation(); delPortfolio(${p.id})">삭제</button>
        <button class="btn btn-ghost btn-sm" style="flex:1"
          onclick="event.stopPropagation(); analyzeStock('${esc(p.ticker)}')">AI 분석</button>
      </div>
    </div>`;
  }).join('');
}

async function submitPortfolio() {
  const ticker   = v('f_ticker');
  const quantity = parseInt(v('f_qty'));
  const avgPrice = parseFloat(v('f_avg'));

  if (!ticker || !quantity || !avgPrice) { toast('⚠️ 모든 항목을 입력하세요'); return; }

  const res = await fetch('/api/portfolio', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticker, quantity, avgPrice }),
  });

  if (res.ok) {
    closeModal('portfolioModal');
    toast('✅ 종목이 등록됐습니다');
    loadPortfolio();
  } else {
    toast('❌ 등록에 실패했습니다');
  }
}

async function delPortfolio(id) {
  if (!confirm('보유 종목을 삭제할까요?')) return;
  await fetch(`/api/portfolio/${id}`, { method: 'DELETE' });
  toast('🗑️ 삭제됐습니다');
  loadPortfolio();
}

/* ─────────────────────────────────────────────────
   WATCHLIST
───────────────────────────────────────────────── */
async function loadWatchlist() {
  try {
    const res  = await fetch('/api/watchlist');
    const json = await res.json();
    renderWatchlistGrid(json.data || []);
  } catch {
    toast('❌ 관심 종목 로드 실패');
  }
}

function renderWatchlistGrid(data) {
  const grid = document.getElementById('watchlistGrid');

  if (!data.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⭐</div>
      <div class="empty-text">관심 종목이 없습니다</div>
    </div>`;
    return;
  }

  grid.innerHTML = data.map(w => `
    <div class="stock-card" onclick="openChart('${esc(w.ticker)}','${w.marketType}','${esc(w.name)}', '')">
      <div class="card-header">
        <div>
          <div class="ticker-label">${esc(w.ticker)}</div>
          <div class="ticker-name">${esc(w.name)}</div>
        </div>
        <span class="market-pill">${w.marketType}</span>
      </div>
      <div class="card-footer" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
        <button class="btn btn-danger btn-sm" style="flex:1"
          onclick="event.stopPropagation(); delWatchlist(${w.id})">해제</button>
        <button class="btn btn-ghost btn-sm" style="flex:1"
          onclick="event.stopPropagation(); analyzeStock('${esc(w.ticker)}')">AI 분석</button>
      </div>
    </div>
  `).join('');
}

async function submitWatchlist() {
  const ticker = v('f_watch');
  if (!ticker) return;

  const res = await fetch('/api/watchlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticker }),
  });

  if (res.ok) {
    closeModal('watchlistModal');
    toast('✅ 관심 종목에 추가됐습니다');
    loadWatchlist();
  } else {
    toast('❌ 등록에 실패했습니다');
  }
}

async function delWatchlist(id) {
  if (!confirm('관심 종목에서 제거할까요?')) return;
  await fetch(`/api/watchlist/${id}`, { method: 'DELETE' });
  toast('🗑️ 제거됐습니다');
  loadWatchlist();
}

/* ─────────────────────────────────────────────────
   ANALYSIS (SSE)
───────────────────────────────────────────────── */
function analyzeStock(ticker) {
  switchTab('analysis');
  document.getElementById('analysisInput').value = ticker;
  startAnalysis();
}

function analyzeFromChart() {
  closeChart();
  analyzeStock(chartTicker);
}

function startAnalysis() {
  const query = document.getElementById('analysisInput').value.trim();
  if (!query) return;

  stopAnalysis();

  const output = document.getElementById('analysisOutput');
  output.innerHTML = '<span class="stream-cursor"></span>';
  document.getElementById('signalResultBar').classList.remove('visible');

  setStatus(true, '분석 중…');
  document.getElementById('analyzeBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = '';

  let raw = '';

  sse = new EventSource(`/api/stock/analyze/${encodeURIComponent(query)}/stream`);

  sse.addEventListener('message', e => {
    raw += e.data;
    output.innerHTML = marked.parse(raw) + '<span class="stream-cursor"></span>';
    output.scrollTop = output.scrollHeight;
  });

  sse.addEventListener('done', e => {
    // Remove cursor
    output.innerHTML = marked.parse(raw);

    const signal = e.data; // BUY | HOLD | SELL
    const configs = {
      BUY:  { label: '매수 (BUY)',  cls: 'hero-buy',  badge: 'sig-buy',  emoji: '🟢' },
      SELL: { label: '매도 (SELL)', cls: 'hero-sell', badge: 'sig-sell', emoji: '🔴' },
      HOLD: { label: '관망 (HOLD)', cls: 'hero-hold', badge: 'sig-hold', emoji: '🟡' },
    };
    const cfg = configs[signal] || configs.HOLD;

    document.getElementById('signalHero').textContent = cfg.emoji + ' ' + signal;
    document.getElementById('signalHero').className = `signal-hero ${cfg.cls}`;
    document.getElementById('signalHeroLabel').textContent = cfg.label;
    document.getElementById('signalTime').textContent =
      `분석 완료 · ${new Date().toLocaleTimeString('ko-KR')} · ${query}`;
    document.getElementById('signalResultBar').classList.add('visible');

    setStatus(false, '분석 완료');
    document.getElementById('analyzeBtn').style.display = '';
    document.getElementById('stopBtn').style.display = 'none';
    stopAnalysis();
  });

  sse.addEventListener('error', e => {
    output.innerHTML += `<p style="color:var(--sell); margin-top:12px;">❌ ${e.data || '분석 중 오류가 발생했습니다'}</p>`;
    setStatus(false, '오류 발생');
    document.getElementById('analyzeBtn').style.display = '';
    document.getElementById('stopBtn').style.display = 'none';
    stopAnalysis();
  });
}

function stopAnalysis() {
  if (sse) { sse.close(); sse = null; }
}

/* ─────────────────────────────────────────────────
   REPORTS
───────────────────────────────────────────────── */
async function loadReports() {
  try {
    const res  = await fetch('/api/reports/today');
    const json = await res.json();
    renderReports(json.data || []);
  } catch {
    toast('❌ 리포트 로드 실패');
  }
}

function renderReports(data) {
  const tbody = document.getElementById('reportTbody');

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;">
      오늘 생성된 시그널이 없습니다
    </td></tr>`;
    return;
  }

  const SIG = {
    BUY:  { label: '🟢 BUY',  cls: 'sig-buy' },
    SELL: { label: '🔴 SELL', cls: 'sig-sell' },
    HOLD: { label: '🟡 HOLD', cls: 'sig-hold' },
  };

  tbody.innerHTML = data.map(r => {
    const s    = SIG[r.signalType] || SIG.HOLD;
    const time = new Date(r.createdAt).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
    const src  = r.sourceType === 'SCHEDULED' ? '🌅 모닝' : '🔍 온디맨드';

    return `<tr>
      <td class="ticker-cell">${esc(r.ticker)}</td>
      <td><span class="signal-badge ${s.cls}">${s.label}</span></td>
      <td class="reason-cell">${esc(r.reason || '—')}</td>
      <td><span class="source-badge">${src}</span></td>
      <td class="time-cell">${time}</td>
    </tr>`;
  }).join('');
}

/* ─────────────────────────────────────────────────
   TRADINGVIEW CHART
───────────────────────────────────────────────── */
function openChart(ticker, market, name, encodedData) {
  chartTicker = ticker;
  chartMarket = market;

  const symbol = market === 'KOR' ? `KRX:${ticker}` : ticker;

  document.getElementById('chartTickerDisp').textContent = `${ticker}  ${name}`;

  // Meta row
  let metaHtml = `<span class="market-pill">${market}</span>`;
  if (encodedData) {
    try {
      const p = JSON.parse(decodeURIComponent(encodedData));
      if (p && p.avgPrice) {
        const rateClass = p.profitRate == null ? 'profit-nil' : p.profitRate >= 0 ? 'profit-pos' : 'profit-neg';
        const rateText  = p.profitRate == null ? '' : (p.profitRate >= 0 ? '+' : '') + p.profitRate + '%';
        metaHtml += `<span style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);">
          평균 ${fmt(p.avgPrice)}
        </span>`;
        if (rateText) {
          metaHtml += `<span class="profit-rate-value ${rateClass}" style="font-size:15px;">${rateText}</span>`;
        }
      }
    } catch {}
  }
  document.getElementById('chartMetaRow').innerHTML = metaHtml;

  // Clear + render chart
  const container = document.getElementById('tv_chart_container');
  container.innerHTML = '';

  new TradingView.widget({
    autosize:            true,
    symbol:              symbol,
    interval:            'D',
    timezone:            'Asia/Seoul',
    theme:               'dark',
    style:               '1',
    locale:              'kr',
    enable_publishing:   false,
    hide_side_toolbar:   false,
    allow_symbol_change: true,
    container_id:        'tv_chart_container',
    studies:             ['RSI@tv-basicstudies', 'MACD@tv-basicstudies'],
    overrides: {
      'paneProperties.background':           '#0C0E12',
      'paneProperties.backgroundType':       'solid',
      'scalesProperties.textColor':          '#5A6478',
    },
  });

  document.getElementById('chartOverlay').classList.add('open');
}

function closeChart() {
  document.getElementById('chartOverlay').classList.remove('open');
  document.getElementById('tv_chart_container').innerHTML = '';
}

/* ─────────────────────────────────────────────────
   MODAL HELPERS
───────────────────────────────────────────────── */
function openModal(id) {
  document.getElementById(id).classList.add('open');
  // Focus first input
  const inp = document.querySelector(`#${id} input`);
  if (inp) setTimeout(() => inp.focus(), 80);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

/* ─────────────────────────────────────────────────
   STATUS / TOAST / UTILS
───────────────────────────────────────────────── */
function setStatus(live, text) {
  const dot = document.getElementById('pulseDot');
  dot.className = 'pulse-dot' + (live ? ' live' : '');
  document.getElementById('statusLabel').textContent = text;
}

function toast(msg) {
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function fmt(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString('ko-KR');
}

function v(id) {
  return document.getElementById(id).value.trim();
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
