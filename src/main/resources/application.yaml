spring:
  application:
    name: demo-dong\

  # Database Settings
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  # Spring AI Settings
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      model: llama3-8b-8192

# Logging Settings
# (logging은 spring의 하위 속성이 아니므로 맨 앞으로 들여쓰기를 빼야 한다)
logging:
  level:
    com.back.myboilerplate: DEBUG


server:
  port: 8090