spring:
  application:
    name: demo-dong\

  # Database Settings
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Spring AI Settings (Phase 8 — 선택적 AI 해석용, 기동 시 stub 허용)
  ai:
    openai:
      api-key: ${GROQ_API_KEY:stub}
      base-url: https://api.groq.com/openai
      model: llama-3.1-8b-instant
      max-tokens: 2048

# Logging Settings
logging:
  level:
    com.back.myboilerplate: DEBUG


server:
  port: 8090

naver:
  api:
    client-id : ${NAVER_CLIENT_ID}
    client-secret : ${NAVER_CLIENT_SECRET}
    news-url: https://openapi.naver.com/v1/search/news.json

stock:
  yahoo:
    rss-url: https://finance.yahoo.com/rss/headline?s=


dart:
  api-key: ${DART_API_KEY}
  base-url: https://opendart.fss.or.kr/api

kis:
  app-key: ${KIS_APP_KEY}
  app-secret: ${KIS_APP_SECRET}
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}

# alpha-vantage: Phase 10 이후 미국 주식 재무 데이터 연동 시 추가

# Swagger / OpenAPI 문서 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.obigo.demodong